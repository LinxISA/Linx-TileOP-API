name: Prepare Linx toolchain
description: Shared cached LLVM build and candidate TileOP header installation.
outputs:
  llvm-sha:
    description: Resolved LLVM commit.
    value: ${{ steps.llvm-source.outputs.sha }}
  toolchain-dir:
    description: Installed toolchain root.
    value: ${{ steps.paths.outputs.toolchain-dir }}
runs:
  using: composite
  steps:
    - name: Checkout toolchain build repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.TOOLCHAIN_REPO }}
        ref: ${{ env.TOOLCHAIN_REF }}
        path: toolchain
    - name: Install host build tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git make cmake ninja-build gcc g++ python3 autoconf m4 \
          pkg-config ccache rsync
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Configure git for component clones
      shell: bash
      run: git config --global --add safe.directory '*'
    - name: Identify host toolchain ABI
      id: host-abi
      shell: bash
      run: |
        set -euo pipefail
        . /etc/os-release
        LIBXML2_VERSION="$(dpkg-query -W -f='${Version}' libxml2 2>/dev/null || echo absent)"
        ABI_KEY="${ID}-${VERSION_ID}-$(uname -m)-libxml2-${LIBXML2_VERSION}"
        ABI_KEY="$(printf '%s' "${ABI_KEY}" | tr -c 'A-Za-z0-9._-' '-')"
        echo "key=${ABI_KEY}" >> "$GITHUB_OUTPUT"
        echo "Host toolchain ABI: ${ABI_KEY}"
    - name: Resolve component revisions and cache identity
      id: llvm-source
      shell: bash
      run: |
        set -euo pipefail
        resolve() {
          local pin="$1" repo="$2" ref="$3"
          if [ -n "$pin" ]; then
            printf '%s\n' "$pin"
          else
            git ls-remote "$repo" "refs/heads/$ref" | awk 'NR == 1 {print $1}'
          fi
        }
        LLVM_SOURCE_SHA="$(resolve "${LLVM_PIN:-}" "$LLVM_REPO" "$LLVM_REF")"
        MUSL_SOURCE_SHA="$(resolve "${MUSL_PIN:-}" https://github.com/LinxISA/linx-musl.git linx)"
        LINUX_SOURCE_SHA="$(resolve "${LINUX_PIN:-}" https://github.com/LinxISA/linux.git main)"
        JEMALLOC_SOURCE_SHA="$(resolve "${JEMALLOC_PIN:-}" https://github.com/LinxISA/jemalloc.git linx)"
        for revision in "$LLVM_SOURCE_SHA" "$MUSL_SOURCE_SHA" "$LINUX_SOURCE_SHA" "$JEMALLOC_SOURCE_SHA"; do
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid component SHA: $revision" >&2; exit 1; }
        done
        PROFILE="${TOOLCHAIN_PROFILE:-full}"
        [[ "$PROFILE" == full || "$PROFILE" == compile-runtime ]] || exit 1
        TILEOP_SDK_SHA=03978fe69612959ca463e65de200248588c2f0dd
        # Exact content key: sources, SDK profile and builder changes invalidate
        # every cached artifact. Never fall back to an unrelated libc/ABI.
        CONTENT_KEY="$(printf '%s\n' "$LLVM_SOURCE_SHA" "$MUSL_SOURCE_SHA" "$LINUX_SOURCE_SHA" \
          "$JEMALLOC_SOURCE_SHA" "$TOOLCHAIN_REF" "$PROFILE" "$TILEOP_SDK_SHA" \
          "$(sha256sum tileop-api/.github/scripts/build-gate-toolchain.sh \
            tileop-api/.github/actions/prepare-toolchain/action.yml | sha256sum | cut -d' ' -f1)" \
          | sha256sum | cut -d' ' -f1)"
        echo "sha=$LLVM_SOURCE_SHA" >> "$GITHUB_OUTPUT"
        echo "musl=$MUSL_SOURCE_SHA" >> "$GITHUB_OUTPUT"
        echo "linux=$LINUX_SOURCE_SHA" >> "$GITHUB_OUTPUT"
        echo "jemalloc=$JEMALLOC_SOURCE_SHA" >> "$GITHUB_OUTPUT"
        echo "tileop-sdk=$TILEOP_SDK_SHA" >> "$GITHUB_OUTPUT"
        echo "content=$CONTENT_KEY" >> "$GITHUB_OUTPUT"
        echo "LLVM=$LLVM_SOURCE_SHA musl=$MUSL_SOURCE_SHA Linux=$LINUX_SOURCE_SHA jemalloc=$JEMALLOC_SOURCE_SHA profile=$PROFILE"
    - name: Restore complete ABI-scoped toolchain cache
      id: cache-llvm-v3
      uses: actions/cache/restore@v4
      with:
        path: toolchain/output/linx_blockisa_llvm_musl
        key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-abi.outputs.key }}-tileop-required-gate-v3-${{ steps.llvm-source.outputs.content }}
    - name: Restore compiler object cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/tileop-ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-abi.outputs.key }}-${{ steps.llvm-source.outputs.content }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-abi.outputs.key }}-
    - name: Initialize component sources
      if: steps.cache-llvm-v3.outputs.cache-hit != 'true'
      working-directory: toolchain
      env:
        LLVM_SOURCE_SHA: ${{ steps.llvm-source.outputs.sha }}
        MUSL_SOURCE_SHA: ${{ steps.llvm-source.outputs.musl }}
        LINUX_SOURCE_SHA: ${{ steps.llvm-source.outputs.linux }}
        JEMALLOC_SOURCE_SHA: ${{ steps.llvm-source.outputs.jemalloc }}
        TILEOP_SDK_SHA: ${{ steps.llvm-source.outputs.tileop-sdk }}
      shell: bash
      run: |
        set -euo pipefail

        checkout_component() {
          local name="$1" repo="$2" revision="$3"
          git init "src/$name"
          git -C "src/$name" remote add origin "$repo"
          git -C "src/$name" fetch --depth=1 origin "$revision"
          git -C "src/$name" checkout --detach FETCH_HEAD
          test "$(git -C "src/$name" rev-parse HEAD)" = "$revision"
        }
        checkout_component llvm-project "$LLVM_REPO" "$LLVM_SOURCE_SHA"
        checkout_component musl https://github.com/LinxISA/linx-musl.git "$MUSL_SOURCE_SHA"
        checkout_component linux-linxisa https://github.com/LinxISA/linux.git "$LINUX_SOURCE_SHA"
        checkout_component jemalloc https://github.com/LinxISA/jemalloc.git "$JEMALLOC_SOURCE_SHA"
        # The full SDK builder also expects a clean TileOP tree. Candidate
        # content is installed only after the reusable SDK has been saved.
        if [ "${TOOLCHAIN_PROFILE:-full}" = full ]; then
          checkout_component Linx-TileOP-API https://github.com/LinxISA/Linx-TileOP-API.git "$TILEOP_SDK_SHA"
        fi
    - name: Build toolchain on cache miss
      if: steps.cache-llvm-v3.outputs.cache-hit != 'true'
      shell: bash
      env:
        CCACHE_DIR: ${{ runner.temp }}/tileop-ccache
        CMAKE_BUILD_PARALLEL_LEVEL: '4'
      run: |
        set -euo pipefail
        ccache --max-size=2G
        # pipefail preserves the first deterministic failure; do not rebuild
        # the entire toolchain a second time on an incompatible source pair.
        bash tileop-api/.github/scripts/build-gate-toolchain.sh toolchain 2>&1 | tee toolchain/build.log
        printf '%s\n' '${{ steps.llvm-source.outputs.sha }}' > "$TOOLCHAIN_INSTALL_DIR/llvm-revision"
        printf '%s\n' '${{ steps.llvm-source.outputs.musl }}' > "$TOOLCHAIN_INSTALL_DIR/musl-revision"
        ccache --show-stats
    - name: Verify cached compiler and runtime ABI
      shell: bash
      run: |
        set -euo pipefail
        test "$(cat "$TOOLCHAIN_INSTALL_DIR/llvm-revision")" = '${{ steps.llvm-source.outputs.sha }}'
        test "$(cat "$TOOLCHAIN_INSTALL_DIR/musl-revision")" = '${{ steps.llvm-source.outputs.musl }}'
        if [ "${TOOLCHAIN_PROFILE:-full}" = compile-runtime ]; then
          "$TOOLCHAIN_INSTALL_DIR/bin/clang" --target=linx64v5-unknown-linux-musl \
            -mlinx-runtime-intra-abi -fsyntax-only -x c /dev/null
        fi
        "$TOOLCHAIN_INSTALL_DIR/bin/clang" --version
    - name: Save LLVM build cache
      if: steps.cache-llvm-v3.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: toolchain/output/linx_blockisa_llvm_musl
        key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-abi.outputs.key }}-tileop-required-gate-v3-${{ steps.llvm-source.outputs.content }}
    - name: Replace TileOP source with candidate content
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p toolchain/src/Linx-TileOP-API
        rsync -a --delete \
          --exclude .git \
          tileop-api/ toolchain/src/Linx-TileOP-API/
    - name: Install candidate TileOP headers
      shell: bash
      run: |
        set -euo pipefail
        CANDIDATE_SHA="$(git -C tileop-api rev-parse HEAD)"
        RESOURCE_DIR="$("${TOOLCHAIN_INSTALL_DIR}/bin/clang" -print-resource-dir)"
        rm -rf "${RESOURCE_DIR}/include/tileop-api"
        make -C toolchain/src/Linx-TileOP-API install \
          CLANG_PREFIX="${TOOLCHAIN_INSTALL_DIR}" \
          TILEOP_API_REVISION="${CANDIDATE_SHA}" \
          TILEOP_API_REVISION_IS_EXACT=1
        cmp \
          toolchain/src/Linx-TileOP-API/include/common/pto_tile_region.hpp \
          "${RESOURCE_DIR}/include/tileop-api/common/pto_tile_region.hpp"
        cmp \
          toolchain/src/Linx-TileOP-API/include/jcore/template_asm.hpp \
          "${RESOURCE_DIR}/include/tileop-api/jcore/template_asm.hpp"
        grep -Fq \
          "#define PTO_TILEOP_API_REVISION \"${CANDIDATE_SHA}\"" \
          "${RESOURCE_DIR}/include/tileop-api/common/pto_tileop_api_revision.hpp"

    - name: Export toolchain path
      id: paths
      shell: bash
      run: echo "toolchain-dir=${TOOLCHAIN_INSTALL_DIR}" >> "$GITHUB_OUTPUT"
