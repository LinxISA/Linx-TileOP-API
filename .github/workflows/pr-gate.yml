name: Linx TileOP required gate

on:
  pull_request:
    branches:
      - linx
  merge_group:
  push:
    branches:
      - linx
  workflow_dispatch:

concurrency:
  group: tileop-required-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  gate:
    name: Validate jcore/template_asm.hpp
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      LLVM_REPO: https://github.com/LinxISA/llvm-project.git
      LLVM_REF: dev-llvm15_56
      TOOLCHAIN_REPO: LinxISA/linx-toolchain-build
      TOOLCHAIN_REF: e6a31efb4cfb17f1f1c33265cbf6dbb61bbba156
      TOOLCHAIN_INSTALL_DIR: ${{ github.workspace }}/toolchain/output/linx_blockisa_llvm_musl
      LINX_TARGET: linx64v5-unknown-linux-musl

    steps:
      - name: Checkout candidate TileOP code
        uses: actions/checkout@v4
        with:
          path: tileop-api

      - name: Prepare shared toolchain and install candidate headers
        id: toolchain
        uses: ./tileop-api/.github/actions/prepare-toolchain

      - name: Check coverage automation and shared cache contracts
        working-directory: tileop-api
        run: |
          python3 test/test_macro_coverage.py
          python3 test/test_pr_gate_cache_order.py

      - name: Show resolved source revisions
        run: |
          echo "TileOP candidate SHA: $(git -C tileop-api rev-parse HEAD)"
          echo "Toolchain SHA: $(git -C toolchain rev-parse HEAD)"
          echo "LLVM SHA: $(git -C toolchain/src/llvm-project rev-parse HEAD)"

      - name: Check template_asm.hpp whitespace
        working-directory: tileop-api
        shell: bash
        run: |
          set -euo pipefail
          git show --check --format= HEAD -- include/jcore/template_asm.hpp

      - name: Check LLVM issue 138 narrow TCMP carriers
        working-directory: tileop-api
        env:
          LINX_CXX: ${{ env.TOOLCHAIN_INSTALL_DIR }}/bin/clang++
          LINX_SYSROOT: ${{ env.TOOLCHAIN_INSTALL_DIR }}/sysroot
        run: python3 test/test_llvm138_narrow_tcmp.py -v

      - name: Check typed PredicateCell producer and consumers
        working-directory: tileop-api
        env:
          LINX_CXX: ${{ env.TOOLCHAIN_INSTALL_DIR }}/bin/clang++
          LINX_SYSROOT: ${{ env.TOOLCHAIN_INSTALL_DIR }}/sysroot
        run: python3 test/test_predicate_adapters.py -v

      - name: Run DType macro regression with associated APIs
        working-directory: tileop-api
        env:
          COMPILER_DIR: ${{ github.workspace }}/toolchain/output/linx_blockisa_llvm_musl/bin
          SYSROOT: ${{ env.TOOLCHAIN_INSTALL_DIR }}/sysroot
        shell: bash
        run: |
          set -euo pipefail
          test/tileop_api/verify_dtypemacro.sh

      - name: Run template_asm.hpp contract checks
        working-directory: tileop-api
        run: |
          python3 test/test_pto0585_layout_interfaces.py \
            PTO0585LayoutInterfaceTest.test_selectors \
            PTO0585LayoutInterfaceTest.test_operand_schemas

      - name: Validate Local M32 TLOAD assembly
        working-directory: tileop-api
        env:
          COMPILER_DIR: ${{ env.TOOLCHAIN_INSTALL_DIR }}/bin
        run: python3 test/test_local_m32_tload_assembly.py

      - name: Parse template_asm.hpp with Linx Clang
        working-directory: toolchain/src/Linx-TileOP-API
        env:
          LINX_SYSROOT: ${{ env.TOOLCHAIN_INSTALL_DIR }}/sysroot/usr
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/template_asm_header_check.cpp <<'CPP'
          #include "jcore/template_asm.hpp"
          CPP
          "${TOOLCHAIN_INSTALL_DIR}/bin/clang++" \
            --target="${LINX_TARGET}" \
            -mlxbc \
            --sysroot="${LINX_SYSROOT}" \
            -nostdinc++ \
            -isystem "${LINX_SYSROOT}/include/c++/v1" \
            -fenable-matrix \
            -std=c++20 \
            -D__linx \
            -DENABLE_TENSOR_INSTR \
            -Iinclude \
            -fsyntax-only \
            /tmp/template_asm_header_check.cpp

      - name: Upload build log on failure
        if: failure() && hashFiles('toolchain/build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-build-log
          path: toolchain/build.log
          retention-days: 14

      - name: Print build log tail on failure
        if: failure()
        run: |
          if [ -f toolchain/build.log ]; then
            echo "===== toolchain/build.log (last 300 lines) ====="
            tail -n 300 toolchain/build.log
          fi

  automerge:
    name: Auto-merge after green gate
    needs: gate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge the PR (gate already green)
        env:
          # GITHUB_TOKEN cannot merge its own PR (integration restriction);
          # a PAT stored as AUTOMERGE_TOKEN performs the merge instead.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # This job only runs when the required gate job is green
          # (needs: gate + default "wait for successful dependencies").
          for i in 1 2 3 4 5; do
            if gh pr merge --squash --auto "$PR_URL" 2>/dev/null || \
               gh pr merge --squash "$PR_URL"; then
              echo "PR merged (or queued)"
              exit 0
            fi
            echo "retry $i"
            sleep 30
          done
          echo "could not merge" >&2
          exit 1
