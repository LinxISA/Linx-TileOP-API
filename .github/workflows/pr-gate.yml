name: Linx TileOP required gate

on:
  pull_request:
    branches:
      - linx
      - "0.59"
  merge_group:
  push:
    branches:
      - linx
      - "0.59"
  workflow_dispatch:

concurrency:
  group: tileop-required-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  MODEL_REVISION: 72223d2d3b40663f3b8e0ccb015db23670c0309a

jobs:
  compile:
    name: Compile TileOP contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      LLVM_REPO: https://github.com/LinxISA/llvm-project.git
      LLVM_REF: "0.59"
      LLVM_PIN: 336b59c0bf76686b1571e7a1738752b87264624b
      MUSL_PIN: 798f0fb819154d1484113a3c8011655ca7c26754
      LINUX_PIN: 12342453fa8c0bbcd30493c45eca14ecae852931
      JEMALLOC_PIN: 4495309cd11cae1a0a2d008c65acd9c410076f06
      TOOLCHAIN_PROFILE: compile-runtime
      TOOLCHAIN_REPO: LinxISA/linx-toolchain-build
      TOOLCHAIN_REF: e6a31efb4cfb17f1f1c33265cbf6dbb61bbba156
      TOOLCHAIN_INSTALL_DIR: ${{ github.workspace }}/toolchain/output/linx_blockisa_llvm_musl
      LINX_TARGET: linx64v5-unknown-linux-musl
      # All external fixture calls use the paired musl IntraCore runtime.
      # Default compiler contract rejection tests run without this flag.
      LINX_TEST_CXXFLAGS: -mlinx-runtime-intra-abi -fno-exceptions -fno-builtin

    steps:
      - name: Checkout candidate TileOP code
        uses: actions/checkout@v4
        with:
          path: tileop-api

      - name: Check private model access before toolchain build
        env:
          GH_TOKEN: ${{ secrets.SSM_READ_TOKEN || secrets.AUTOMERGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure SSM_READ_TOKEN with Contents:read access to LinxISA/SuperScalarModel (or grant the existing AUTOMERGE_TOKEN access).'
            exit 1
          fi
          if ! gh api "repos/LinxISA/SuperScalarModel/git/commits/$MODEL_REVISION" --jq .sha > "$RUNNER_TEMP/model-revision"; then
            echo '::error::The model credential cannot read the pinned SuperScalarModel commit. Check repository access and organization SSO authorization.'
            exit 1
          fi
          test "$(cat "$RUNNER_TEMP/model-revision")" = "$MODEL_REVISION"

      - name: Check cache and runtime contracts before toolchain build
        working-directory: tileop-api
        run: |
          python3 test/test_pr_gate_cache_order.py
          python3 test/test_runtime_adapter_contract.py
          c++ -std=c++17 -Iinclude test/test_sync_core_contract.cpp -o "$RUNNER_TEMP/sync-core-contract"
          "$RUNNER_TEMP/sync-core-contract"

      - name: Check MSGB protocol and runtime
        working-directory: tileop-api
        run: make check-sync-proposal

      - name: Prepare shared toolchain and install candidate headers
        id: toolchain
        uses: ./tileop-api/.github/actions/prepare-toolchain

      - name: Check coverage automation and shared cache contracts
        working-directory: tileop-api
        run: |
          python3 test/test_macro_coverage.py
          python3 test/test_pr_gate_cache_order.py

      - name: Show resolved source revisions
        run: |
          echo "TileOP candidate SHA: $(git -C tileop-api rev-parse HEAD)"
          echo "Toolchain SHA: $(git -C toolchain rev-parse HEAD)"
          echo "LLVM SHA: $(cat "$TOOLCHAIN_INSTALL_DIR/llvm-revision")"
          echo "musl SHA: $(cat "$TOOLCHAIN_INSTALL_DIR/musl-revision")"

      - name: Check template_asm.hpp whitespace
        working-directory: tileop-api
        shell: bash
        run: |
          set -euo pipefail
          git show --check --format= HEAD -- include/jcore/template_asm.hpp

      - name: Run independent target regression suites
        working-directory: tileop-api
        env:
          LINX_CXX: ${{ env.TOOLCHAIN_INSTALL_DIR }}/bin/clang++
          LINX_CLANG: ${{ env.TOOLCHAIN_INSTALL_DIR }}/bin/clang
          LINX_SYSROOT: ${{ env.TOOLCHAIN_INSTALL_DIR }}/sysroot
          COMPILER_DIR: ${{ env.TOOLCHAIN_INSTALL_DIR }}/bin
          PTO_REQUIRE_SHARED_ND_OBJECT: '1'
        run: python3 .github/scripts/run-target-checks.py --workers 2 --output ../gate-results

      - name: Run DType macro regression with associated APIs
        working-directory: tileop-api
        env:
          COMPILER_DIR: ${{ github.workspace }}/toolchain/output/linx_blockisa_llvm_musl/bin
          SYSROOT: ${{ env.TOOLCHAIN_INSTALL_DIR }}/sysroot
        shell: bash
        run: |
          set -euo pipefail
          test/tileop_api/verify_dtypemacro.sh

      - name: Run template_asm.hpp contract checks
        working-directory: tileop-api
        run: |
          python3 test/test_pto0585_layout_interfaces.py \
            PTO0585LayoutInterfaceTest.test_selectors \
            PTO0585LayoutInterfaceTest.test_operand_schemas

      - name: Parse template_asm.hpp with Linx Clang
        working-directory: toolchain/src/Linx-TileOP-API
        env:
          LINX_SYSROOT: ${{ env.TOOLCHAIN_INSTALL_DIR }}/sysroot/usr
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/template_asm_header_check.cpp <<'CPP'
          #include "jcore/template_asm.hpp"
          CPP
          "${TOOLCHAIN_INSTALL_DIR}/bin/clang++" \
            --target="${LINX_TARGET}" \
            -mlxbc \
            --sysroot="${LINX_SYSROOT}" \
            -nostdinc++ \
            -isystem "${LINX_SYSROOT}/include/c++/v1" \
            -fenable-matrix \
            -std=c++20 \
            -D__linx \
            -DENABLE_TENSOR_INSTR \
            -Iinclude \
            -fsyntax-only \
            /tmp/template_asm_header_check.cpp

      - name: Upload compile regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tileop-compile-evidence
          path: gate-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build log on failure
        if: failure() && hashFiles('toolchain/build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-build-log
          path: toolchain/build.log
          retention-days: 14

      - name: Print build log tail on failure
        if: failure()
        run: |
          if [ -f toolchain/build.log ]; then
            echo "===== toolchain/build.log (last 300 lines) ====="
            tail -n 300 toolchain/build.log
          fi

  multi-pe:
    name: Validate four-PE startup ELF
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LLVM_REPO: https://github.com/LinxISA/llvm-project.git
      LLVM_REF: "0.59"
      LLVM_PIN: 336b59c0bf76686b1571e7a1738752b87264624b
      MUSL_PIN: 798f0fb819154d1484113a3c8011655ca7c26754
      LINUX_PIN: 12342453fa8c0bbcd30493c45eca14ecae852931
      JEMALLOC_PIN: 4495309cd11cae1a0a2d008c65acd9c410076f06
      TOOLCHAIN_PROFILE: compile-runtime
      TOOLCHAIN_REPO: LinxISA/linx-toolchain-build
      TOOLCHAIN_REF: e6a31efb4cfb17f1f1c33265cbf6dbb61bbba156
      TOOLCHAIN_INSTALL_DIR: ${{ github.workspace }}/toolchain/output/linx_blockisa_llvm_musl
    steps:
      - uses: actions/checkout@v4
        with:
          path: tileop-api
      - name: Checkout private model with cross-repository credential
        uses: actions/checkout@v4
        with:
          repository: LinxISA/SuperScalarModel
          ref: ${{ env.MODEL_REVISION }}
          path: model
          token: ${{ secrets.SSM_READ_TOKEN || secrets.AUTOMERGE_TOKEN }}
          persist-credentials: false
      - name: Install model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libelf-dev cmake ninja-build g++
      - name: Restore model startup harness
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model/bin/gfrun_hosted_startup_test
          key: tileop-startup-model-ubuntu-24.04-${{ runner.arch }}-${{ env.MODEL_REVISION }}
      - name: Build model startup harness
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S model -B model/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build model/build --parallel 4 --target gfrun_hosted_startup_test
      - name: Prepare shared toolchain and install candidate headers
        uses: ./tileop-api/.github/actions/prepare-toolchain
      - name: Compile and run four startup scenarios
        run: |
          set -euo pipefail
          mkdir -p multi-pe-results
          # An exact SDK cache does not contain sources. Read the same pinned
          # worker source independently so archive extraction remains checked.
          mkdir -p runtime-source/compiler-rt/lib/builtins/linx64v5 runtime-source/compiler-rt/include/linx
          for file in compiler-rt/lib/builtins/linx64v5/group_worker.c compiler-rt/include/linx/pto_runtime.h; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/LinxISA/llvm-project/$LLVM_PIN/$file" \
              --output "runtime-source/$file"
          done
          resource="$("$TOOLCHAIN_INSTALL_DIR/bin/clang" -print-resource-dir)"
          cmp tileop-api/include/common/pto_runtime.h runtime-source/compiler-rt/include/linx/pto_runtime.h
          python3 tileop-api/test/multi_pe/run_startup.py \
            --compiler "$TOOLCHAIN_INSTALL_DIR/bin/clang" \
            --sysroot "$TOOLCHAIN_INSTALL_DIR/sysroot" \
            --worker runtime-source/compiler-rt/lib/builtins/linx64v5/group_worker.c \
            --runtime-archive "$resource/lib/linux/libclang_rt.builtins-linx64v5.a" \
            --model-test model/bin/gfrun_hosted_startup_test \
            --output multi-pe-results/startup
          printf '%s\n' "$MODEL_REVISION" > multi-pe-results/model-revision.txt
      - name: Upload startup evidence and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-pe-startup-evidence
          path: |
            multi-pe-results/
            toolchain/build.log
          retention-days: 14

  gate:
    # Preserve the branch protection check name, with both compile and actual
    # four-PE execution required. A skipped dependency must not report green.
    name: Validate jcore/template_asm.hpp
    needs: [compile, multi-pe]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all gate checks
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          STARTUP_RESULT: ${{ needs.multi-pe.result }}
        run: |
          test "$COMPILE_RESULT" = success
          test "$STARTUP_RESULT" = success

  automerge:
    name: Auto-merge after green gate
    needs: gate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge the PR (gate already green)
        env:
          # GITHUB_TOKEN cannot merge its own PR (integration restriction);
          # a PAT stored as AUTOMERGE_TOKEN performs the merge instead.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # This job only runs when the required gate job is green
          # (needs: gate + default "wait for successful dependencies").
          for i in 1 2 3 4 5; do
            if gh pr merge --squash --auto "$PR_URL" 2>/dev/null || \
               gh pr merge --squash "$PR_URL"; then
              echo "PR merged (or queued)"
              exit 0
            fi
            echo "retry $i"
            sleep 30
          done
          echo "could not merge" >&2
          exit 1
